<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HTML Formatter & Beautifier</title>
<style>
:root {
  --bg: #0f1724;
  --card: #0b1220;
  --accent: #06b6d4;
  --muted: #9aa8b2;
  --glass: rgba(255, 255, 255, 0.03);
}
* {
  box-sizing: border-box;
}
html, body {
  min-height: 100%;
  margin: 0;
  font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
  background: linear-gradient(180deg, #041025 0%, #0b1730 100%);
  color: #e6eef6;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.app {
  width: 900px;
  max-width: 96%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.03);
}
h1 {
  margin: 0;
  font-size: 22px;
}
p.lead {
  margin: 6px 0 18px;
  color: var(--muted);
  font-size: 13px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover {
  text-decoration: underline;
}
.control-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 15px;
}
.option-card {
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.03);
  border-radius: 8px;
  padding: 12px;
}
label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 500;
}
select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.05);
  color: inherit;
  font-size: 14px;
  transition: border-color 0.2s;
}
select:focus {
  outline: none;
  border-color: var(--accent);
}
.dropzone {
  border: 2px dashed rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  padding: 15px;
  text-align: center;
  background: var(--glass);
  cursor: pointer;
  transition: border-color 0.2s, background-color 0.2s;
  margin-bottom: 15px;
}
.dropzone:hover, .dropzone.dragover {
  border-color: var(--accent);
  background: rgba(6, 182, 212, 0.05);
}
.dropzone p {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}
.text-areas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 15px;
}
textarea {
  width: 100%;
  min-height: 300px;
  padding: 12px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.03);
  color: inherit;
  font-family: monospace;
  font-size: 13px;
  resize: vertical;
  box-sizing: border-box;
}
textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}
button {
  background: linear-gradient(90deg, var(--accent), #3b82f6);
  border: 0;
  padding: 10px 18px;
  font-weight: 600;
  border-radius: 8px;
  color: #042027;
  cursor: pointer;
  font-size: 13px;
  transition: opacity 0.2s, transform 0.1s;
}
button:hover {
  opacity: 0.9;
}
button:active {
  transform: scale(0.98);
}
button.secondary {
  background: var(--glass);
  color: #e6eef6;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
button.secondary:hover {
  background: rgba(255, 255, 255, 0.08);
}
.validation-result {
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
  margin-top: 10px;
}
.validation-result.valid {
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.2);
  color: #34d399;
  display: block;
}
.validation-result.invalid {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
  display: block;
}

@media (max-width: 768px) {
  .control-grid, .text-areas {
    grid-template-columns: 1fr !important;
  }
  .actions {
    flex-direction: column !important;
    gap: 10px !important;
  }
  button {
    width: 100%;
  }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.0/beautify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.0/beautify-html.min.js"></script>
</head>
<body>
<div class="app" role="main">
  <a href="../index.html" class="back-link">← Back to Home</a>
  <h1>HTML Formatter & Beautifier</h1>
  <p class="lead">Beautify, validate, format, or minify your HTML code locally. Supports custom indentation options and provides instant error detection.</p>

  <div class="control-grid">
    <div class="option-card">
      <label for="indent-size">Indentation</label>
      <select id="indent-size">
        <option value="2">2 Spaces</option>
        <option value="4">4 Spaces</option>
        <option value="tab">Tab</option>
      </select>
    </div>
    <div class="option-card">
      <label>Quick Actions</label>
      <button id="demo-btn" class="secondary" style="width: 100%; height: 38px; padding: 0;">Load Demo HTML</button>
    </div>
  </div>

  <div class="dropzone" id="dropzone">
    <p>Drag & Drop an .html or .txt file here, or click to browse</p>
    <input type="file" id="file-input" style="display: none;" accept=".html,.htm,.txt" />
  </div>

  <div class="text-areas">
    <div>
      <label for="input">Input HTML</label>
      <textarea id="input" placeholder="Paste your raw, messy HTML here..."></textarea>
    </div>
    <div>
      <label for="output">Formatted/Minified HTML</label>
      <textarea id="output" placeholder="HTML result will appear here..." readonly></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="format-btn">Format HTML</button>
    <button id="minify-btn" class="secondary">Minify HTML</button>
    <button id="clear-btn" class="secondary">Clear All</button>
    <button id="copy-btn" class="secondary">Copy Result</button>
    <button id="download-btn" class="secondary">Download HTML</button>
  </div>

  <div id="validation-box" class="validation-result"></div>
</div>

<script>
const indentSize = document.getElementById('indent-size');
const demoBtn = document.getElementById('demo-btn');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');

const inputArea = document.getElementById('input');
const outputArea = document.getElementById('output');

const formatBtn = document.getElementById('format-btn');
const minifyBtn = document.getElementById('minify-btn');
const clearBtn = document.getElementById('clear-btn');
const copyBtn = document.getElementById('copy-btn');
const downloadBtn = document.getElementById('download-btn');
const validationBox = document.getElementById('validation-box');

const DEMO_HTML = `<!DOCTYPE html>
<html>
<head>
<title>My Sample Page</title>
<style>
body { background-color: #f0f0f0; }
h1 { color: #333; }
</style>
</head>
<body>
<div class="container" id="main">
<h1>Hello, World!</h1>
<p>This is an <strong>unstyled</strong>, raw HTML sample to demonstrate formatting.</p>
<ul>
<li>First item</li>
<li>Second item</li>
</ul>
<!-- Form comment -->
<form action="/submit" method="post">
<label for="username">Username:</label>
<input type="text" id="username" name="username" />
<button type="submit">Submit</button>
</form>
</div>
<script>
console.log("Page loaded successfully");
<\/script>
</body>
</html>`;

function showValidation(message, isValid) {
  validationBox.textContent = message;
  validationBox.className = 'validation-result ' + (isValid ? 'valid' : 'invalid');
  validationBox.style.display = 'block';
}

function hideValidation() {
  validationBox.style.display = 'none';
  validationBox.className = 'validation-result';
}

function getIndentParam() {
  const val = indentSize.value;
  if (val === 'tab') return '\t';
  return ' '.repeat(parseInt(val, 10));
}

function doFormatting() {
  hideValidation();
  const rawText = inputArea.value.trim();
  if (!rawText) {
    showValidation('Please enter some HTML code to format.', false);
    outputArea.value = '';
    return;
  }

  try {
    const indentChar = indentSize.value === 'tab' ? '\t' : ' ';
    const indentCount = indentSize.value === 'tab' ? 1 : parseInt(indentSize.value, 10);

    const formatted = window.html_beautify(rawText, {
      indent_size: indentCount,
      indent_char: indentChar,
      max_preserve_newlines: 2,
      preserve_newlines: true,
      keep_array_indentation: false,
      break_chained_methods: false,
      indent_scripts: "normal",
      brace_style: "collapse",
      space_before_conditional: true,
      unescape_strings: false,
      jslint_happy: false,
      end_with_newline: false,
      wrap_line_length: 0,
      indent_inner_html: false,
      comma_first: false,
      e4x: false,
      indent_empty_lines: false
    });

    outputArea.value = formatted;
    showValidation('✓ Success - HTML formatted successfully!', true);
  } catch (err) {
    showValidation('❌ HTML Formatting Error: ' + err.message, false);
    outputArea.value = '';
  }
}

function processMinify() {
  hideValidation();
  const rawText = inputArea.value.trim();
  if (!rawText) {
    showValidation('Please enter some HTML code to minify.', false);
    outputArea.value = '';
    return;
  }

  try {
    // Basic but robust minification logic
    // 1. Remove comments
    let minified = rawText.replace(/<!--[\s\S]*?-->/g, '');
    // 2. Collapse whitespaces around tags
    minified = minified.replace(/>\s+</g, '><');
    // 3. Remove excess sequential spaces and newlines
    minified = minified.replace(/\s{2,}/g, ' ');
    minified = minified.trim();

    outputArea.value = minified;
    showValidation('✓ Success - HTML minified successfully!', true);
  } catch (err) {
    showValidation('❌ HTML Minification Error: ' + err.message, false);
    outputArea.value = '';
  }
}

// Drag & Drop
dropzone.addEventListener('click', () => fileInput.click());

dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
  dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  handleFile(file);
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  handleFile(file);
});

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    inputArea.value = e.target.result;
    hideValidation();
    doFormatting();
  };
  reader.readAsText(file);
}

// Clear All
clearBtn.addEventListener('click', () => {
  inputArea.value = '';
  outputArea.value = '';
  hideValidation();
});

// Demo HTML
demoBtn.addEventListener('click', () => {
  inputArea.value = DEMO_HTML;
  hideValidation();
  doFormatting();
});

// Copy Result
copyBtn.addEventListener('click', () => {
  if (outputArea.value) {
    navigator.clipboard.writeText(outputArea.value).then(() => {
      const originalText = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      setTimeout(() => {
        copyBtn.textContent = originalText;
      }, 1500);
    }).catch(err => {
      console.error('Copy failed: ', err);
    });
  }
});

// Download result
downloadBtn.addEventListener('click', () => {
  const content = outputArea.value;
  if (!content) return;

  const blob = new Blob([content], { type: 'text/html' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = 'formatted_document.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// Auto re-format on indent adjustment if input exists
indentSize.addEventListener('change', () => {
  if (inputArea.value.trim() && outputArea.value.trim()) {
    doFormatting();
  }
});

formatBtn.addEventListener('click', doFormatting);
minifyBtn.addEventListener('click', processMinify);

inputArea.addEventListener('input', () => {
  if (!inputArea.value.trim()) {
    hideValidation();
    outputArea.value = '';
  }
});
</script>
</body>
</html>
