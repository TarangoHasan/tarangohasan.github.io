<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HTML Entity Encoder & Decoder</title>
<style>
:root {
  --bg: #0f1724;
  --card: #0b1220;
  --accent: #06b6d4;
  --muted: #9aa8b2;
  --glass: rgba(255, 255, 255, 0.03);
}
* {
  box-sizing: border-box;
}
html, body {
  min-height: 100%;
  margin: 0;
  font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
  background: linear-gradient(180deg, #041025 0%, #0b1730 100%);
  color: #e6eef6;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.app {
  width: 780px;
  max-width: 96%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.03);
}
h1 {
  margin: 0;
  font-size: 22px;
}
p.lead {
  margin: 6px 0 18px;
  color: var(--muted);
  font-size: 13px;
}
label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 500;
}
select, input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.03);
  color: inherit;
  font-family: inherit;
  box-sizing: border-box;
}
select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover {
  text-decoration: underline;
}
.control-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 15px;
}
.option-card {
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.03);
  padding: 12px;
  border-radius: 8px;
}
.dropzone {
  border: 2px dashed rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  padding: 15px;
  text-align: center;
  background: var(--glass);
  cursor: pointer;
  transition: border-color 0.2s, background-color 0.2s;
  margin-bottom: 15px;
}
.dropzone:hover, .dropzone.dragover {
  border-color: var(--accent);
  background: rgba(6, 182, 212, 0.05);
}
.dropzone p {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}
.text-areas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 15px;
}
textarea {
  min-height: 260px;
  font-family: monospace;
  font-size: 13px;
  resize: vertical;
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}
button {
  background: linear-gradient(90deg, var(--accent), #3b82f6);
  border: 0;
  padding: 10px 18px;
  font-weight: 600;
  border-radius: 8px;
  color: #042027;
  cursor: pointer;
  font-size: 13px;
  transition: opacity 0.2s, transform 0.1s;
}
button:hover {
  opacity: 0.9;
}
button:active {
  transform: scale(0.98);
}
button.secondary {
  background: var(--glass);
  color: #e6eef6;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
button.secondary:hover {
  background: rgba(255, 255, 255, 0.08);
}
.validation-result {
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
  margin-top: 10px;
}
.validation-result.valid {
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.2);
  color: #34d399;
  display: block;
}
.validation-result.invalid {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
  display: block;
}

@media (max-width: 768px) {
  .control-grid, .text-areas {
    grid-template-columns: 1fr !important;
  }
  .actions {
    flex-direction: column !important;
    gap: 10px !important;
  }
  button {
    width: 100%;
  }
}
</style>
</head>
<body>
<div class="app" role="main">
  <a href="../index.html" class="back-link">← Back to Home</a>
  <h1>HTML Entity Encoder & Decoder</h1>
  <p class="lead">Convert text characters into HTML entities or decode entities back into plain text instantly.</p>

  <div class="control-grid">
    <div class="option-card">
      <label for="mode-select">Mode</label>
      <select id="mode-select">
        <option value="encode">Encode (Text → HTML Entities)</option>
        <option value="decode">Decode (HTML Entities → Text)</option>
      </select>
    </div>
    <div class="option-card">
      <label for="entity-format">Encoding Style</label>
      <select id="entity-format">
        <option value="named">Named Entities (&amp;lt;, &amp;gt;, &amp;amp;, etc.)</option>
        <option value="numeric-dec">Decimal Numeric (&amp;#60;, &amp;#62;, etc.)</option>
        <option value="numeric-hex">Hexadecimal Numeric (&amp;#x3C;, &amp;#x3E;, etc.)</option>
        <option value="non-ascii">Non-ASCII &amp; Special Chars Only</option>
      </select>
    </div>
  </div>

  <div class="dropzone" id="dropzone">
    <p>Drag & Drop a text file here, or click to browse</p>
    <input type="file" id="file-input" style="display: none;" accept=".html,.txt,.xml,.json,.js,.css" />
  </div>

  <div class="text-areas">
    <div>
      <label for="input" id="input-label">Plain Text Input</label>
      <textarea id="input" placeholder="Type or paste plain text here..."></textarea>
    </div>
    <div>
      <label for="output" id="output-label">HTML Entity Output</label>
      <textarea id="output" placeholder="Converted HTML entities will appear here..." readonly></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="convert-btn">Convert</button>
    <button id="swap-btn" class="secondary">Swap Mode</button>
    <button id="clear-btn" class="secondary">Clear All</button>
    <button id="copy-btn" class="secondary">Copy Result</button>
    <button id="download-btn" class="secondary">Download Result</button>
  </div>

  <div id="validation-box" class="validation-result"></div>
</div>

<script>
const modeSelect = document.getElementById('mode-select');
const entityFormat = document.getElementById('entity-format');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');
const inputArea = document.getElementById('input');
const outputArea = document.getElementById('output');
const inputLabel = document.getElementById('input-label');
const outputLabel = document.getElementById('output-label');

const convertBtn = document.getElementById('convert-btn');
const swapBtn = document.getElementById('swap-btn');
const clearBtn = document.getElementById('clear-btn');
const copyBtn = document.getElementById('copy-btn');
const downloadBtn = document.getElementById('download-btn');
const validationBox = document.getElementById('validation-box');

// Basic HTML entity map
const namedEntityMap = {
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;',
  '`': '&#96;',
  '¢': '&cent;',
  '£': '&pound;',
  '¥': '&yen;',
  '€': '&euro;',
  '©': '&copy;',
  '®': '&reg;',
  '™': '&trade;',
  '«': '&laquo;',
  '»': '&raquo;',
  '§': '&sect;',
  'µ': '&micro;',
  '¶': '&para;',
  '±': '&plusmn;',
  '÷': '&divide;',
  '×': '&times;',
  '°': '&deg;',
  '½': '&frac12;',
  '¼': '&frac14;',
  '¾': '&frac34;',
  '•': '&bull;',
  '…': '&hellip;',
  '–': '&ndash;',
  '—': '&mdash;',
  ' ': '&nbsp;'
};

function updateUI() {
  const mode = modeSelect.value;
  if (mode === 'encode') {
    inputLabel.textContent = 'Plain Text Input';
    outputLabel.textContent = 'HTML Entity Output';
    inputArea.placeholder = 'Type or paste plain text here...';
    outputArea.placeholder = 'Converted HTML entities will appear here...';
    entityFormat.disabled = false;
  } else {
    inputLabel.textContent = 'HTML Entity Input';
    outputLabel.textContent = 'Decoded Text Output';
    inputArea.placeholder = 'Paste HTML entities here (e.g. &lt;div&gt;Hello &amp;amp; Welcome&lt;/div&gt;)...';
    outputArea.placeholder = 'Decoded plain text will appear here...';
    entityFormat.disabled = true;
  }
  hideValidation();
}

function showValidation(message, isValid) {
  validationBox.textContent = message;
  validationBox.className = 'validation-result ' + (isValid ? 'valid' : 'invalid');
}

function hideValidation() {
  validationBox.style.display = 'none';
  validationBox.className = 'validation-result';
}

function encodeText(str, format) {
  if (!str) return '';
  if (format === 'named') {
    return str.replace(/[\s\S]/g, (ch) => {
      if (namedEntityMap[ch]) return namedEntityMap[ch];
      const code = ch.codePointAt(0);
      if (code > 126 || (code < 32 && code !== 9 && code !== 10 && code !== 13)) {
        return `&#${code};`;
      }
      return ch;
    });
  } else if (format === 'numeric-dec') {
    let res = '';
    for (const char of str) {
      const code = char.codePointAt(0);
      res += `&#${code};`;
    }
    return res;
  } else if (format === 'numeric-hex') {
    let res = '';
    for (const char of str) {
      const code = char.codePointAt(0);
      res += `&#x${code.toString(16).toUpperCase()};`;
    }
    return res;
  } else if (format === 'non-ascii') {
    return str.replace(/[\s\S]/g, (ch) => {
      if (namedEntityMap[ch]) return namedEntityMap[ch];
      const code = ch.codePointAt(0);
      if (code > 127) {
        return `&#${code};`;
      }
      return ch;
    });
  }
  return str;
}

function decodeEntities(str) {
  if (!str) return '';
  const textarea = document.createElement('textarea');
  textarea.innerHTML = str;
  return textarea.value;
}

function doConversion() {
  const mode = modeSelect.value;
  const val = inputArea.value;

  if (!val.trim()) {
    showValidation('Please enter text to convert.', false);
    outputArea.value = '';
    return;
  }

  if (mode === 'encode') {
    const fmt = entityFormat.value;
    const result = encodeText(val, fmt);
    outputArea.value = result;
    showValidation('✓ Text encoded to HTML entities successfully!', true);
  } else {
    const result = decodeEntities(val);
    outputArea.value = result;
    showValidation('✓ HTML entities decoded to text successfully!', true);
  }
}

// Drag & Drop
dropzone.addEventListener('click', () => fileInput.click());

dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
  dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  handleFile(file);
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  handleFile(file);
});

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    inputArea.value = e.target.result;
    hideValidation();
    doConversion();
  };
  reader.readAsText(file);
}

// Swap Mode
swapBtn.addEventListener('click', () => {
  const mode = modeSelect.value;
  modeSelect.value = mode === 'encode' ? 'decode' : 'encode';
  updateUI();
  const temp = inputArea.value;
  inputArea.value = outputArea.value;
  outputArea.value = temp;
  if (inputArea.value) {
    doConversion();
  }
});

// Clear All
clearBtn.addEventListener('click', () => {
  inputArea.value = '';
  outputArea.value = '';
  hideValidation();
});

// Copy Result with fallback
copyBtn.addEventListener('click', () => {
  if (outputArea.value) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(outputArea.value).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = originalText; }, 1500);
      }).catch(() => {
        fallbackCopy(outputArea.value);
      });
    } else {
      fallbackCopy(outputArea.value);
    }
  }
});

function fallbackCopy(text) {
  outputArea.select();
  try {
    document.execCommand('copy');
    const originalText = copyBtn.textContent;
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = originalText; }, 1500);
  } catch (err) {
    console.error('Fallback copy failed', err);
  }
}

// Download Result
downloadBtn.addEventListener('click', () => {
  const content = outputArea.value;
  if (!content) return;

  const mode = modeSelect.value;
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = mode === 'encode' ? 'html_entities.txt' : 'decoded_text.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// Event Listeners
modeSelect.addEventListener('change', updateUI);
entityFormat.addEventListener('change', () => { if (inputArea.value) doConversion(); });
convertBtn.addEventListener('click', doConversion);
inputArea.addEventListener('input', () => {
  if (inputArea.value.trim()) {
    doConversion();
  } else {
    hideValidation();
    outputArea.value = '';
  }
});

// Initialize UI
updateUI();
</script>
</body>
</html>
