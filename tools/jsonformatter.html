<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>JSON Formatter/Validator</title>
<style>
:root {
  --bg: #0f1724;
  --card: #0b1220;
  --accent: #06b6d4;
  --muted: #9aa8b2;
  --glass: rgba(255, 255, 255, 0.03);
}
* {
  box-sizing: border-box;
}
html, body {
  min-height: 100%;
  margin: 0;
  font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
  background: linear-gradient(180deg, #041025 0%, #0b1730 100%);
  color: #e6eef6;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.app {
  width: 800px;
  max-width: 96%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.03);
}
h1 {
  margin: 0;
  font-size: 20px;
}
p.lead {
  margin: 6px 0 18px;
  color: var(--muted);
  font-size: 13px;
}
textarea {
  width: 100%;
  min-height: 250px;
  padding: 12px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.03);
  color: inherit;
  font-family: monospace;
  font-size: 14px;
  resize: vertical;
  box-sizing: border-box;
}
textarea:focus {
  outline: none;
  border-color: var(--accent);
}
button {
  background: linear-gradient(90deg, var(--accent), #3b82f6);
  border: 0;
  padding: 10px 16px;
  font-weight: 600;
  border-radius: 8px;
  color: #042027;
  cursor: pointer;
  transition: opacity 0.2s;
}
button:hover {
  opacity: 0.9;
}
button.secondary {
  background: var(--glass);
  color: #e6eef6;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
button.secondary:hover {
  background: rgba(255, 255, 255, 0.08);
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover {
  text-decoration: underline;
}
.flex-row {
  display: flex;
  gap: 10px;
}
.validation-result {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
}
.validation-result.valid {
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.2);
  color: #34d399;
  display: block;
}
.validation-result.invalid {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
  display: block;
}

@media (max-width: 768px) {
  .flex-row {
    flex-direction: column !important;
  }
  button {
    width: 100%;
  }
}
</style>
</head>
<body>
<div class="app" role="main">
  <a href="../index.html" class="back-link">← Back to Home</a>
  <h1>JSON Formatter/Validator</h1>
  <p class="lead">Paste your JSON data to automatically format, validate, and minify it.</p>
  <textarea id="json-input" placeholder="Paste or type your JSON here..."></textarea>
  <div style="height:10px"></div>
  <div class="flex-row">
    <button id="formatBtn">Format JSON</button>
    <button id="minifyBtn" class="secondary">Minify JSON</button>
    <button id="copyBtn" class="secondary">Copy JSON</button>
  </div>
  <div id="errors" class="validation-result"></div>
</div>
<script>
const jsonInput = document.getElementById('json-input');
const formatBtn = document.getElementById('formatBtn');
const minifyBtn = document.getElementById('minifyBtn');
const copyBtn = document.getElementById('copyBtn');
const errors = document.getElementById('errors');

function showResult(text, isValid) {
  errors.textContent = text;
  if (isValid) {
    errors.className = 'validation-result valid';
  } else {
    errors.className = 'validation-result invalid';
  }
}

function hideResult() {
  errors.style.display = 'none';
  errors.className = 'validation-result';
}

formatBtn.addEventListener('click', () => {
  const val = jsonInput.value.trim();
  if (!val) {
    showResult('Please enter JSON text to format.', false);
    return;
  }
  try {
    const jsonObj = JSON.parse(val);
    jsonInput.value = JSON.stringify(jsonObj, null, 2);
    showResult('✓ Valid JSON - Formatted successfully!', true);
  } catch (e) {
    showResult('❌ Invalid JSON: ' + e.message, false);
  }
});

minifyBtn.addEventListener('click', () => {
  const val = jsonInput.value.trim();
  if (!val) {
    showResult('Please enter JSON text to minify.', false);
    return;
  }
  try {
    const jsonObj = JSON.parse(val);
    jsonInput.value = JSON.stringify(jsonObj);
    showResult('✓ Valid JSON - Minified successfully!', true);
  } catch (e) {
    showResult('❌ Invalid JSON: ' + e.message, false);
  }
});

copyBtn.addEventListener('click', () => {
  if (jsonInput.value) {
    navigator.clipboard.writeText(jsonInput.value);
    const originalText = copyBtn.textContent;
    copyBtn.textContent = "Copied!";
    setTimeout(() => copyBtn.textContent = originalText, 2000);
  }
});

jsonInput.addEventListener('input', () => {
  if (!jsonInput.value.trim()) {
    hideResult();
  }
});
</script>
</body>
</html>
