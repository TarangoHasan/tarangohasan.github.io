<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Image Converter</title>
<style>
:root {
  --bg: #0f1724;
  --card: #0b1220;
  --accent: #06b6d4;
  --muted: #9aa8b2;
  --glass: rgba(255, 255, 255, 0.03);
}
* {
  box-sizing: border-box;
}
html, body {
  min-height: 100%;
  margin: 0;
  font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
  background: linear-gradient(180deg, #041025 0%, #0b1730 100%);
  color: #e6eef6;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.app {
  width: 600px;
  max-width: 96%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.03);
}
h1 {
  margin: 0;
  font-size: 20px;
}
p.lead {
  margin: 6px 0 18px;
  color: var(--muted);
  font-size: 13px;
}
label {
  display: block;
  font-size: 13px;
  margin-bottom: 6px;
  color: var(--muted);
}
input, select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.03);
  color: inherit;
  box-sizing: border-box;
}
input:focus, select:focus {
  outline: none;
  border-color: var(--accent);
}
button {
  background: linear-gradient(90deg, var(--accent), #3b82f6);
  border: 0;
  padding: 12px 18px;
  font-weight: 600;
  border-radius: 8px;
  color: #042027;
  cursor: pointer;
  transition: opacity 0.2s;
  width: 100%;
  font-size: 14px;
}
button:hover {
  opacity: 0.9;
}

.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover {
  text-decoration: underline;
}

.validation-result {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
}
.validation-result.valid {
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.2);
  color: #34d399;
  display: block;
}
.validation-result.invalid {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
  display: block;
}
</style>
</head>
<body>
<div class="app" role="main">
  <a href="../index.html" class="back-link">← Back to Home</a>
  <h1>Image Converter</h1>
  <p class="lead">Convert images to PNG, JPG, or WEBP.</p>
  <label for="file">Choose Image</label>
  <input id="file" type="file" accept="image/*" />
  <div style="height:10px"></div>
  <label for="format">Convert to</label>
  <select id="format">
    <option value="image/png">PNG</option>
    <option value="image/jpeg">JPG</option>
    <option value="image/webp">WEBP</option>
  </select>
  <div style="height:15px"></div>
  <button id="convertBtn">Convert and Download</button>
  <div id="errors" class="validation-result"></div>
</div>
<script>
const fileInput = document.getElementById('file');
const formatSelect = document.getElementById('format');
const convertBtn = document.getElementById('convertBtn');
const errors = document.getElementById('errors');

function showValidation(msg, isValid) {
  errors.textContent = msg;
  errors.className = 'validation-result ' + (isValid ? 'valid' : 'invalid');
}

function hideValidation() {
  errors.style.display = 'none';
  errors.className = 'validation-result';
}

convertBtn.addEventListener('click', () => {
  hideValidation();
  const file = fileInput.files[0];
  if (!file) {
    showValidation('Please select an image file.', false);
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');

      const format = formatSelect.value;
      if (format === 'image/jpeg') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.drawImage(img, 0, 0);

      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        let ext = format.split('/')[1];
        if (ext === 'jpeg') ext = 'jpg';
        a.download = `converted.${ext}`;
        a.click();
        URL.revokeObjectURL(url);
        showValidation('✓ Image converted and downloaded successfully!', true);
      }, format);
    };
    img.onerror = () => {
      showValidation('❌ Failed to load the image file.', false);
    };
    img.src = e.target.result;
  };
  reader.onerror = () => {
    showValidation('❌ Failed to read the file.', false);
  };
  reader.readAsDataURL(file);
});

fileInput.addEventListener('change', hideValidation);
</script>
</body>
</html>
