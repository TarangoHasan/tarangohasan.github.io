<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>URL Encoder/Decoder</title>
<style>
:root {
  --bg: #0f1724;
  --card: #0b1220;
  --accent: #06b6d4;
  --muted: #9aa8b2;
  --glass: rgba(255, 255, 255, 0.03);
}
* {
  box-sizing: border-box;
}
html, body {
  min-height: 100%;
  margin: 0;
  font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
  background: linear-gradient(180deg, #041025 0%, #0b1730 100%);
  color: #e6eef6;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.app {
  width: 800px;
  max-width: 96%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.03);
}
h1 {
  margin: 0;
  font-size: 22px;
}
p.lead {
  margin: 6px 0 18px;
  color: var(--muted);
  font-size: 13px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover {
  text-decoration: underline;
}
.control-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 15px;
}
.option-card {
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.03);
  border-radius: 8px;
  padding: 15px;
}
label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 500;
}
select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.05);
  color: inherit;
  font-size: 14px;
  transition: border-color 0.2s;
}
select:focus {
  outline: none;
  border-color: var(--accent);
}
.checkbox-group {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  font-size: 13px;
  margin-top: 5px;
}
.checkbox-group input {
  cursor: pointer;
}
textarea {
  width: 100%;
  min-height: 140px;
  padding: 12px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.03);
  color: inherit;
  font-family: monospace;
  font-size: 14px;
  resize: vertical;
  box-sizing: border-box;
}
textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}
button {
  background: linear-gradient(90deg, var(--accent), #3b82f6);
  border: 0;
  padding: 10px 18px;
  font-weight: 600;
  border-radius: 8px;
  color: #042027;
  cursor: pointer;
  font-size: 13px;
  transition: opacity 0.2s, transform 0.1s;
}
button:hover {
  opacity: 0.9;
}
button:active {
  transform: scale(0.98);
}
button.secondary {
  background: var(--glass);
  color: #e6eef6;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
button.secondary:hover {
  background: rgba(255, 255, 255, 0.08);
}
.validation-result {
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
  margin-top: 10px;
}
.validation-result.valid {
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.2);
  color: #34d399;
  display: block;
}
.validation-result.invalid {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
  display: block;
}

@media (max-width: 768px) {
  .control-grid {
    grid-template-columns: 1fr !important;
  }
  .actions {
    flex-direction: column !important;
    gap: 10px !important;
  }
  button {
    width: 100%;
  }
}
</style>
</head>
<body>
<div class="app" role="main">
  <a href="../index.html" class="back-link">← Back to Home</a>
  <h1>URL Encoder/Decoder</h1>
  <p class="lead">Encode or decode URLs and text components securely with custom parsing modes and live conversion.</p>

  <div class="control-grid">
    <div class="option-card">
      <label for="action-mode">Action Mode</label>
      <select id="action-mode">
        <option value="encode">Encode (Text to URL)</option>
        <option value="decode">Decode (URL to Text)</option>
      </select>
    </div>
    <div class="option-card">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="url-mode">Encoding Mode</label>
        <select id="url-mode">
          <option value="component">Standard Component (encodeURIComponent)</option>
          <option value="full">Full URL (encodeURI)</option>
        </select>
        <label class="checkbox-group">
          <input type="checkbox" id="live-convert" checked />
          <span>Real-time Live Conversion</span>
        </label>
      </div>
    </div>
  </div>

  <label for="input">Input Text / URL</label>
  <textarea id="input" placeholder="Enter text to encode here..."></textarea>
  <div style="height:10px"></div>

  <div class="actions">
    <button id="convertBtn">Convert Now</button>
    <button id="swapBtn" class="secondary">Swap Input/Output</button>
    <button id="clearBtn" class="secondary">Clear All</button>
  </div>

  <label for="output">Result</label>
  <textarea id="output" placeholder="Result will appear here..." readonly></textarea>
  <div style="height:10px"></div>

  <button id="copyBtn">Copy Result</button>
  <div id="validation-box" class="validation-result"></div>
</div>

<script>
const input = document.getElementById('input');
const output = document.getElementById('output');
const actionMode = document.getElementById('action-mode');
const urlMode = document.getElementById('url-mode');
const liveConvert = document.getElementById('live-convert');

const convertBtn = document.getElementById('convertBtn');
const swapBtn = document.getElementById('swapBtn');
const clearBtn = document.getElementById('clearBtn');
const copyBtn = document.getElementById('copyBtn');
const validationBox = document.getElementById('validation-box');

function updateUI() {
  const mode = actionMode.value;
  if (mode === 'encode') {
    input.placeholder = 'Enter plain text to encode here...';
    output.placeholder = 'URL encoded result will appear here...';
  } else {
    input.placeholder = 'Enter URL encoded string to decode here...';
    output.placeholder = 'Decoded plain text will appear here...';
  }

  if (liveConvert.checked) {
    convertBtn.style.display = 'none';
  } else {
    convertBtn.style.display = 'inline-block';
  }
}

function showValidation(message, isValid) {
  validationBox.textContent = message;
  validationBox.className = 'validation-result ' + (isValid ? 'valid' : 'invalid');
  validationBox.style.display = 'block';
}

function hideValidation() {
  validationBox.style.display = 'none';
  validationBox.className = 'validation-result';
}

function process() {
  hideValidation();
  const val = input.value;
  if (!val) {
    output.value = '';
    return;
  }

  const mode = actionMode.value;
  const isFull = urlMode.value === 'full';

  if (mode === 'encode') {
    try {
      output.value = isFull ? encodeURI(val) : encodeURIComponent(val);
      showValidation('✓ Encoded successfully!', true);
    } catch (e) {
      showValidation('❌ Encoding Error: ' + e.message, false);
      output.value = '';
    }
  } else {
    try {
      output.value = isFull ? decodeURI(val) : decodeURIComponent(val);
      showValidation('✓ Decoded successfully!', true);
    } catch (e) {
      showValidation('❌ Decoding Error: ' + e.message, false);
      output.value = '';
    }
  }
}

// Swap Mode
swapBtn.addEventListener('click', () => {
  const currentMode = actionMode.value;
  actionMode.value = currentMode === 'encode' ? 'decode' : 'encode';
  updateUI();

  const temp = input.value;
  input.value = output.value;
  output.value = temp;

  if (input.value) {
    process();
  }
});

// Clear
clearBtn.addEventListener('click', () => {
  input.value = '';
  output.value = '';
  hideValidation();
});

// Copy Result
copyBtn.addEventListener('click', () => {
  if (output.value) {
    navigator.clipboard.writeText(output.value).then(() => {
      const originalText = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      setTimeout(() => {
        copyBtn.textContent = originalText;
      }, 1500);
    }).catch(() => {});
  }
});

// Events
actionMode.addEventListener('change', () => {
  updateUI();
  process();
});

urlMode.addEventListener('change', () => {
  if (input.value) {
    process();
  }
});

liveConvert.addEventListener('change', () => {
  updateUI();
  if (liveConvert.checked && input.value) {
    process();
  }
});

input.addEventListener('input', () => {
  if (liveConvert.checked) {
    process();
  } else if (!input.value.trim()) {
    hideValidation();
    output.value = '';
  }
});

convertBtn.addEventListener('click', process);

// Init
updateUI();
</script>
</body>
</html>
