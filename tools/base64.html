<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Base64 Encoder/Decoder</title>
<style>
:root {
  --bg: #0f1724;
  --card: #0b1220;
  --accent: #06b6d4;
  --muted: #9aa8b2;
  --glass: rgba(255, 255, 255, 0.03);
}
* {
  box-sizing: border-box;
}
html, body {
  min-height: 100%;
  margin: 0;
  font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
  background: linear-gradient(180deg, #041025 0%, #0b1730 100%);
  color: #e6eef6;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.app {
  width: 800px;
  max-width: 96%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.03);
}
h1 {
  margin: 0;
  font-size: 22px;
}
p.lead {
  margin: 6px 0 18px;
  color: var(--muted);
  font-size: 13px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover {
  text-decoration: underline;
}
.control-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 15px;
}
.option-card {
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.03);
  border-radius: 8px;
  padding: 15px;
}
label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 500;
}
select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.05);
  color: inherit;
  font-size: 14px;
  transition: border-color 0.2s;
}
select:focus {
  outline: none;
  border-color: var(--accent);
}
.checkbox-group {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  font-size: 13px;
  margin-top: 5px;
}
.checkbox-group input {
  cursor: pointer;
}
.dropzone {
  border: 2px dashed rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  padding: 15px;
  text-align: center;
  background: var(--glass);
  cursor: pointer;
  transition: border-color 0.2s, background-color 0.2s;
  margin-bottom: 15px;
}
.dropzone:hover, .dropzone.dragover {
  border-color: var(--accent);
  background: rgba(6, 182, 212, 0.05);
}
.dropzone p {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}
textarea {
  width: 100%;
  min-height: 150px;
  padding: 10px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.03);
  color: inherit;
  font-family: monospace;
  font-size: 13px;
  resize: vertical;
  box-sizing: border-box;
}
textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}
button {
  background: linear-gradient(90deg, var(--accent), #3b82f6);
  border: 0;
  padding: 10px 18px;
  font-weight: 600;
  border-radius: 8px;
  color: #042027;
  cursor: pointer;
  font-size: 13px;
  transition: opacity 0.2s, transform 0.1s;
}
button:hover {
  opacity: 0.9;
}
button:active {
  transform: scale(0.98);
}
button.secondary {
  background: var(--glass);
  color: #e6eef6;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
button.secondary:hover {
  background: rgba(255, 255, 255, 0.08);
}
.validation-result {
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
  margin-top: 10px;
}
.validation-result.valid {
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.2);
  color: #34d399;
  display: block;
}
.validation-result.invalid {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
  display: block;
}

@media (max-width: 768px) {
  .control-grid {
    grid-template-columns: 1fr !important;
  }
  .actions {
    flex-direction: column !important;
    gap: 10px !important;
  }
  button {
    width: 100%;
  }
}
</style>
</head>
<body>
<div class="app" role="main">
  <a href="../index.html" class="back-link">← Back to Home</a>
  <h1>Base64 Encoder/Decoder</h1>
  <p class="lead">Encode text or files to Base64, or decode Base64 strings with precision and real-time support.</p>

  <div class="control-grid">
    <div class="option-card">
      <label for="action-mode">Action Mode</label>
      <select id="action-mode">
        <option value="encode">Encode (Text to Base64)</option>
        <option value="decode">Decode (Base64 to Text)</option>
      </select>
    </div>
    <div class="option-card">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label class="checkbox-group">
          <input type="checkbox" id="live-convert" checked />
          <span>Real-time Live Conversion</span>
        </label>
        <label class="checkbox-group" id="data-uri-wrapper">
          <input type="checkbox" id="data-uri" />
          <span>Include Data URI scheme prefix</span>
        </label>
      </div>
    </div>
  </div>

  <div class="dropzone" id="dropzone">
    <p>Drag & Drop a file here to Encode to Base64, or click to browse</p>
    <input type="file" id="file-input" style="display: none;" />
  </div>

  <label for="input">Input Text / Base64</label>
  <textarea id="input" placeholder="Enter text here..."></textarea>
  <div style="height:10px"></div>

  <div class="actions">
    <button id="convertBtn">Convert Now</button>
    <button id="swapBtn" class="secondary">Swap Input/Output</button>
    <button id="clearBtn" class="secondary">Clear</button>
  </div>

  <label for="output">Result</label>
  <textarea id="output" placeholder="Result will appear here..." readonly></textarea>
  <div style="height:10px"></div>

  <div class="actions">
    <button id="copyBtn">Copy Result</button>
    <button id="downloadFileBtn" class="secondary" style="display: none;">Download Decoded File</button>
  </div>

  <div id="validation-box" class="validation-result"></div>
</div>

<script>
const input = document.getElementById('input');
const output = document.getElementById('output');
const actionMode = document.getElementById('action-mode');
const liveConvert = document.getElementById('live-convert');
const dataUri = document.getElementById('data-uri');
const dataUriWrapper = document.getElementById('data-uri-wrapper');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');

const convertBtn = document.getElementById('convertBtn');
const swapBtn = document.getElementById('swapBtn');
const clearBtn = document.getElementById('clearBtn');
const copyBtn = document.getElementById('copyBtn');
const downloadFileBtn = document.getElementById('downloadFileBtn');
const validationBox = document.getElementById('validation-box');

let lastEncodedMime = 'application/octet-stream';
let isFileMode = false;

function updateUI() {
  const mode = actionMode.value;
  if (mode === 'encode') {
    dataUriWrapper.style.display = 'flex';
    input.placeholder = 'Enter plain text to encode here...';
    output.placeholder = 'Base64 result will appear here...';
    dropzone.style.display = 'block';
  } else {
    dataUriWrapper.style.display = 'none';
    input.placeholder = 'Paste Base64 encoded string here...';
    output.placeholder = 'Decoded text will appear here...';
    dropzone.style.display = 'none';
  }

  if (liveConvert.checked) {
    convertBtn.style.display = 'none';
  } else {
    convertBtn.style.display = 'inline-block';
  }
}

function showValidation(message, isValid) {
  validationBox.textContent = message;
  validationBox.className = 'validation-result ' + (isValid ? 'valid' : 'invalid');
  validationBox.style.display = 'block';
}

function hideValidation() {
  validationBox.style.display = 'none';
  validationBox.className = 'validation-result';
}

function encodeText(str) {
  try {
    const encoder = new TextEncoder();
    const data = encoder.encode(str);
    let binary = "";
    for (let i = 0; i < data.length; i++) {
      binary += String.fromCharCode(data[i]);
    }
    let b64 = btoa(binary);
    if (dataUri.checked) {
      b64 = `data:text/plain;base64,${b64}`;
    }
    return b64;
  } catch (e) {
    throw new Error('Encoding error: ' + e.message);
  }
}

function decodeText(b64) {
  try {
    let cleanB64 = b64.trim();

    // Check if it is a Data URI
    if (cleanB64.startsWith('data:')) {
      const parts = cleanB64.split(',');
      if (parts.length > 1) {
        cleanB64 = parts[1];
      }
    }

    // Clean spaces
    cleanB64 = cleanB64.replace(/\s/g, '');

    const binary = atob(cleanB64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    const decoder = new TextDecoder();
    return decoder.decode(bytes);
  } catch (e) {
    throw new Error('Decoding error: ' + e.message);
  }
}

function process() {
  hideValidation();
  downloadFileBtn.style.display = 'none';

  const val = input.value;
  if (!val) {
    output.value = '';
    return;
  }

  const mode = actionMode.value;
  if (mode === 'encode') {
    try {
      output.value = encodeText(val);
    } catch (e) {
      showValidation(e.message, false);
      output.value = '';
    }
  } else {
    try {
      // Check if it is a binary-looking Base64
      let isBinary = false;
      let checkVal = val.trim();
      if (checkVal.startsWith('data:')) {
        const mimeMatch = checkVal.match(/data:(.*?);base64/);
        if (mimeMatch && !mimeMatch[1].startsWith('text/')) {
          isBinary = true;
          lastEncodedMime = mimeMatch[1];
        }
      }

      const decodedText = decodeText(val);
      output.value = decodedText;

      // If contains weird non-printable characters, it might be binary
      const nonPrintable = /[\x00-\x08\x0E-\x1F\x7F]/;
      if (nonPrintable.test(decodedText) || isBinary) {
        showValidation('✓ Decoded Base64 successfully! Detected binary file data.', true);
        downloadFileBtn.style.display = 'inline-block';
      }
    } catch (e) {
      // Might be a file, let's see if we can decode as a file download even if text decoding fails
      try {
        const parts = val.trim().split(',');
        let checkB64 = parts.length > 1 ? parts[1] : parts[0];
        checkB64 = checkB64.replace(/\s/g, '');
        atob(checkB64); // validate base64

        output.value = "[Binary Data - Cannot display as text]";
        showValidation('✓ Decoded Base64 successfully! Binary file detected.', true);
        downloadFileBtn.style.display = 'inline-block';
      } catch (innerErr) {
        showValidation('❌ Invalid Base64: ' + e.message, false);
        output.value = '';
      }
    }
  }
}

// Drag & Drop for Files
dropzone.addEventListener('click', () => fileInput.click());

dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
  dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  handleFile(file);
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  handleFile(file);
});

function handleFile(file) {
  if (!file) return;
  hideValidation();

  const reader = new FileReader();
  reader.onload = (e) => {
    const arrayBuffer = e.target.result;
    const bytes = new Uint8Array(arrayBuffer);
    let binary = "";
    for (let i = 0; i < bytes.length; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    let b64 = btoa(binary);

    lastEncodedMime = file.type || 'application/octet-stream';
    if (dataUri.checked) {
      b64 = `data:${lastEncodedMime};base64,${b64}`;
    }

    actionMode.value = 'encode';
    updateUI();

    input.value = `[File: ${file.name} (${file.size} bytes)]`;
    output.value = b64;
    showValidation(`✓ File "${file.name}" converted to Base64 successfully!`, true);
  };
  reader.readAsArrayBuffer(file);
}

// Download Decoded File
downloadFileBtn.addEventListener('click', () => {
  try {
    const val = input.value;
    const parts = val.trim().split(',');
    let mime = lastEncodedMime || 'application/octet-stream';
    let b64Data = val;

    if (parts.length > 1 && parts[0].startsWith('data:')) {
      const mimeMatch = parts[0].match(/data:(.*?);base64/);
      if (mimeMatch) {
        mime = mimeMatch[1];
      }
      b64Data = parts[1];
    }

    b64Data = b64Data.replace(/\s/g, '');
    const binary = atob(b64Data);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }

    const blob = new Blob([bytes], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    let ext = mime.split('/')[1] || 'bin';
    if (ext.includes('+')) ext = ext.split('+')[0];
    a.download = `decoded_file.${ext}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {
    showValidation('Download failed: ' + e.message, false);
  }
});

// Swap Mode
swapBtn.addEventListener('click', () => {
  const currentMode = actionMode.value;
  actionMode.value = currentMode === 'encode' ? 'decode' : 'encode';
  updateUI();

  const temp = input.value;
  input.value = output.value;
  output.value = temp;

  if (input.value) {
    process();
  }
});

// Clear
clearBtn.addEventListener('click', () => {
  input.value = '';
  output.value = '';
  hideValidation();
  downloadFileBtn.style.display = 'none';
});

// Copy Result
copyBtn.addEventListener('click', () => {
  if (output.value) {
    navigator.clipboard.writeText(output.value).then(() => {
      const originalText = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      setTimeout(() => {
        copyBtn.textContent = originalText;
      }, 1500);
    }).catch(err => {
      console.error('Copy failed: ', err);
    });
  }
});

// Events
actionMode.addEventListener('change', () => {
  updateUI();
  process();
});

liveConvert.addEventListener('change', () => {
  updateUI();
  if (liveConvert.checked && input.value) {
    process();
  }
});

dataUri.addEventListener('change', () => {
  if (input.value) {
    process();
  }
});

input.addEventListener('input', () => {
  if (liveConvert.checked) {
    process();
  } else if (!input.value.trim()) {
    hideValidation();
    output.value = '';
  }
});

convertBtn.addEventListener('click', process);

// Init
updateUI();
</script>
</body>
</html>
