<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>YAML ⇄ JSON Converter</title>
<style>
:root {
  --bg: #0f1724;
  --card: #0b1220;
  --accent: #06b6d4;
  --muted: #9aa8b2;
  --glass: rgba(255, 255, 255, 0.03);
}
* {
  box-sizing: border-box;
}
html, body {
  min-height: 100%;
  margin: 0;
  font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
  background: linear-gradient(180deg, #041025 0%, #0b1730 100%);
  color: #e6eef6;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.app {
  width: 850px;
  max-width: 96%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.03);
}
h1 {
  margin: 0;
  font-size: 22px;
}
p.lead {
  margin: 6px 0 18px;
  color: var(--muted);
  font-size: 13px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover {
  text-decoration: underline;
}
.control-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 15px;
}
.option-card {
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.03);
  border-radius: 8px;
  padding: 15px;
}
label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 500;
}
select, input[type="number"] {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.05);
  color: inherit;
  font-size: 14px;
  transition: border-color 0.2s;
}
select:focus, input[type="number"]:focus {
  outline: none;
  border-color: var(--accent);
}
.dropzone {
  border: 2px dashed rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  padding: 15px;
  text-align: center;
  background: var(--glass);
  cursor: pointer;
  transition: border-color 0.2s, background-color 0.2s;
  margin-bottom: 15px;
}
.dropzone:hover, .dropzone.dragover {
  border-color: var(--accent);
  background: rgba(6, 182, 212, 0.05);
}
.dropzone p {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}
.text-areas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 15px;
}
textarea {
  width: 100%;
  min-height: 280px;
  padding: 12px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.03);
  color: inherit;
  font-family: monospace;
  font-size: 13px;
  resize: vertical;
  box-sizing: border-box;
}
textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}
button {
  background: linear-gradient(90deg, var(--accent), #3b82f6);
  border: 0;
  padding: 10px 18px;
  font-weight: 600;
  border-radius: 8px;
  color: #042027;
  cursor: pointer;
  font-size: 13px;
  transition: opacity 0.2s, transform 0.1s;
}
button:hover {
  opacity: 0.9;
}
button:active {
  transform: scale(0.98);
}
button.secondary {
  background: var(--glass);
  color: #e6eef6;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
button.secondary:hover {
  background: rgba(255, 255, 255, 0.08);
}
.validation-result {
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
  margin-top: 10px;
}
.validation-result.valid {
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.2);
  color: #34d399;
  display: block;
}
.validation-result.invalid {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
  display: block;
}

@media (max-width: 768px) {
  .control-grid, .text-areas {
    grid-template-columns: 1fr !important;
  }
  .actions {
    flex-direction: column !important;
    gap: 10px !important;
  }
  button {
    width: 100%;
  }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>
<div class="app" role="main">
  <a href="../index.html" class="back-link">← Back to Home</a>
  <h1>YAML ⇄ JSON Converter</h1>
  <p class="lead">Convert between YAML and JSON formats with custom indentation, syntax validation, and file exports.</p>

  <div class="control-grid">
    <div class="option-card">
      <label for="conversion-direction">Mode</label>
      <select id="conversion-direction">
        <option value="yaml2json">YAML to JSON</option>
        <option value="json2yaml">JSON to YAML</option>
      </select>
    </div>
    <div class="option-card">
      <label for="indent-size">Indentation Spaces</label>
      <select id="indent-size">
        <option value="2">2 Spaces</option>
        <option value="4">4 Spaces</option>
      </select>
    </div>
  </div>

  <div class="dropzone" id="dropzone">
    <p>Drag & Drop a .yaml, .yml, or .json file here, or click to browse</p>
    <input type="file" id="file-input" style="display: none;" accept=".yaml,.yml,.json,.txt" />
  </div>

  <div class="text-areas">
    <div>
      <label for="input" id="input-label">YAML Input</label>
      <textarea id="input" placeholder="Paste YAML text here..."></textarea>
    </div>
    <div>
      <label for="output" id="output-label">JSON Output</label>
      <textarea id="output" placeholder="Conversion result will appear here..." readonly></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="convert-btn">Convert</button>
    <button id="swap-btn" class="secondary">Swap Mode</button>
    <button id="clear-btn" class="secondary">Clear All</button>
    <button id="copy-btn" class="secondary">Copy Result</button>
    <button id="download-btn" class="secondary">Download Result</button>
  </div>

  <div id="validation-box" class="validation-result"></div>
</div>

<script>
const conversionDirection = document.getElementById('conversion-direction');
const indentSize = document.getElementById('indent-size');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');
const inputArea = document.getElementById('input');
const outputArea = document.getElementById('output');
const inputLabel = document.getElementById('input-label');
const outputLabel = document.getElementById('output-label');

const convertBtn = document.getElementById('convert-btn');
const swapBtn = document.getElementById('swap-btn');
const clearBtn = document.getElementById('clear-btn');
const copyBtn = document.getElementById('copy-btn');
const downloadBtn = document.getElementById('download-btn');
const validationBox = document.getElementById('validation-box');

function updateUI() {
  const mode = conversionDirection.value;
  if (mode === 'yaml2json') {
    inputLabel.textContent = 'YAML Input';
    outputLabel.textContent = 'JSON Output';
    inputArea.placeholder = 'Paste YAML text here...';
    outputArea.placeholder = 'JSON result will appear here...';
  } else {
    inputLabel.textContent = 'JSON Input';
    outputLabel.textContent = 'YAML Output';
    inputArea.placeholder = 'Paste JSON text here...';
    outputArea.placeholder = 'YAML result will appear here...';
  }
  hideValidation();
}

function showValidation(message, isValid) {
  validationBox.textContent = message;
  validationBox.className = 'validation-result ' + (isValid ? 'valid' : 'invalid');
}

function hideValidation() {
  validationBox.style.display = 'none';
  validationBox.className = 'validation-result';
}

function doConversion() {
  const mode = conversionDirection.value;
  const val = inputArea.value.trim();
  const indent = parseInt(indentSize.value, 10);

  if (!val) {
    showValidation('Please enter some text to convert.', false);
    outputArea.value = '';
    return;
  }

  if (mode === 'yaml2json') {
    try {
      const parsed = jsyaml.load(val);
      if (parsed === undefined) {
        showValidation('❌ Loaded empty or invalid YAML document.', false);
        outputArea.value = '';
        return;
      }
      outputArea.value = JSON.stringify(parsed, null, indent);
      showValidation('✓ Success - Parsed YAML into JSON successfully!', true);
    } catch (e) {
      showValidation('❌ YAML Parsing Error: ' + e.message, false);
      outputArea.value = '';
    }
  } else {
    try {
      const parsedJson = JSON.parse(val);
      const yaml = jsyaml.dump(parsedJson, { indent: indent });
      outputArea.value = yaml;
      showValidation('✓ Success - Converted JSON to YAML successfully!', true);
    } catch (e) {
      showValidation('❌ Invalid JSON: ' + e.message, false);
      outputArea.value = '';
    }
  }
}

// Drag & Drop
dropzone.addEventListener('click', () => fileInput.click());

dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
  dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  handleFile(file);
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  handleFile(file);
});

function handleFile(file) {
  if (!file) return;
  const name = file.name.toLowerCase();

  if (name.endsWith('.json')) {
    conversionDirection.value = 'json2yaml';
  } else if (name.endsWith('.yaml') || name.endsWith('.yml')) {
    conversionDirection.value = 'yaml2json';
  }
  updateUI();

  const reader = new FileReader();
  reader.onload = (e) => {
    inputArea.value = e.target.result;
    hideValidation();
    doConversion();
  };
  reader.readAsText(file);
}

// Swap Mode
swapBtn.addEventListener('click', () => {
  const mode = conversionDirection.value;
  conversionDirection.value = mode === 'yaml2json' ? 'json2yaml' : 'yaml2json';
  updateUI();
  const temp = inputArea.value;
  inputArea.value = outputArea.value;
  outputArea.value = temp;
  if (inputArea.value) {
    doConversion();
  }
});

// Clear All
clearBtn.addEventListener('click', () => {
  inputArea.value = '';
  outputArea.value = '';
  hideValidation();
});

// Copy Result
copyBtn.addEventListener('click', () => {
  if (outputArea.value) {
    navigator.clipboard.writeText(outputArea.value).then(() => {
      const originalText = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      setTimeout(() => {
        copyBtn.textContent = originalText;
      }, 1500);
    }).catch(err => console.error("Clipboard error:", err));
  }
});

// Download result
downloadBtn.addEventListener('click', () => {
  const content = outputArea.value;
  if (!content) return;

  const mode = conversionDirection.value;
  const isJson = mode === 'yaml2json';
  const blob = new Blob([content], { type: isJson ? 'application/json' : 'text/yaml' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = isJson ? 'converted_data.json' : 'converted_data.yaml';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// Event Listeners
conversionDirection.addEventListener('change', updateUI);
indentSize.addEventListener('change', () => {
  if (inputArea.value) doConversion();
});
convertBtn.addEventListener('click', doConversion);
inputArea.addEventListener('input', () => {
  if (!inputArea.value.trim()) {
    hideValidation();
  }
});

// Initialize UI
updateUI();
</script>
</body>
</html>
