<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PDF Merger</title>
<style>
:root {
  --bg: #0f1724;
  --card: #0b1220;
  --accent: #06b6d4;
  --muted: #9aa8b2;
  --glass: rgba(255, 255, 255, 0.03);
}
* {
  box-sizing: border-box;
}
html, body {
  min-height: 100%;
  margin: 0;
  font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
  background: linear-gradient(180deg, #041025 0%, #0b1730 100%);
  color: #e6eef6;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.app {
  width: 700px;
  max-width: 96%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.03);
}
h1 {
  margin: 0;
  font-size: 22px;
}
p.lead {
  margin: 6px 0 18px;
  color: var(--muted);
  font-size: 13px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover {
  text-decoration: underline;
}

/* Styled dropzone for file upload */
.dropzone {
  border: 2px dashed rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  padding: 24px;
  text-align: center;
  background: var(--glass);
  cursor: pointer;
  transition: border-color 0.2s, background-color 0.2s;
  margin-bottom: 20px;
}
.dropzone:hover, .dropzone.dragover {
  border-color: var(--accent);
  background: rgba(6, 182, 212, 0.05);
}
.dropzone p {
  margin: 0;
  font-size: 14px;
  color: #ffffff;
  font-weight: 500;
}
.dropzone span {
  font-size: 12px;
  color: var(--muted);
  display: block;
  margin-top: 6px;
}

/* File list panel */
.file-list-panel {
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.03);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 20px;
}
.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.panel-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
}
.clear-btn {
  background: transparent;
  border: 0;
  color: #ef4444;
  font-size: 12px;
  cursor: pointer;
  font-weight: 500;
}
.clear-btn:hover {
  text-decoration: underline;
}

.file-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.file-item {
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.02);
  padding: 10px 14px;
  border-radius: 8px;
  cursor: grab;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background-color 0.2s;
}
.file-item:hover {
  background: rgba(255, 255, 255, 0.06);
}
.file-item:active {
  cursor: grabbing;
}
.file-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-width: 80%;
}
.file-name {
  font-size: 13px;
  font-weight: 600;
  color: #e6eef6;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.file-size {
  font-size: 11px;
  color: var(--muted);
}
.remove-btn {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
  padding: 6px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.remove-btn:hover {
  background: #ef4444;
  color: #ffffff;
}

/* Actions */
.actions {
  display: flex;
  gap: 12px;
  flex-direction: column;
}
button.primary {
  background: linear-gradient(90deg, var(--accent), #3b82f6);
  border: 0;
  padding: 12px 20px;
  font-weight: 600;
  border-radius: 8px;
  color: #042027;
  cursor: pointer;
  font-size: 14px;
  transition: opacity 0.2s, transform 0.1s;
}
button.primary:hover {
  opacity: 0.9;
}
button.primary:active {
  transform: scale(0.98);
}

.progress-msg {
  text-align: center;
  font-size: 13px;
  color: var(--accent);
  font-weight: 500;
  margin-top: 10px;
}

.validation-result {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
}
.validation-result.valid {
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.2);
  color: #34d399;
  display: block;
}
.validation-result.invalid {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
  display: block;
}

/* Download box style */
.download-card {
  margin-top: 15px;
  background: rgba(6, 182, 212, 0.05);
  border: 1px solid rgba(6, 182, 212, 0.1);
  border-radius: 8px;
  padding: 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.download-card span {
  font-size: 13px;
  font-weight: 600;
  color: #e6eef6;
}
.download-btn {
  background: var(--accent);
  color: #042027;
  padding: 8px 16px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: 700;
  font-size: 12px;
  transition: opacity 0.2s;
}
.download-btn:hover {
  opacity: 0.9;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs/Sortable.min.js"></script>
</head>
<body>
<div class="app" role="main">
  <a href="../index.html" class="back-link">← Back to Home</a>
  <h1>PDF Merger</h1>
  <p class="lead">Upload and reorder multiple PDF documents to merge them into a single file instantly.</p>

  <!-- Interactive Drag & Drop Area -->
  <div class="dropzone" id="dropzone">
    <p>Drag & Drop your PDFs here or click to browse</p>
    <span>Supports multiple file selection</span>
    <input id="files" type="file" accept="application/pdf" multiple style="display: none;" />
  </div>

  <!-- Reorderable Files List -->
  <div class="file-list-panel" id="file-list-panel" style="display: none;">
    <div class="panel-header">
      <span class="panel-title" id="file-count-label">Selected Files (0)</span>
      <button class="clear-btn" id="clearAllBtn">Clear All</button>
    </div>
    <div class="file-list" id="file-list"></div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button id="mergeBtn" class="primary">Merge PDFs</button>
  </div>

  <div id="progress" class="progress-msg"></div>
  <div id="errors" class="validation-result"></div>
  <div id="download-box" style="display: none;"></div>
</div>

<script>
const { PDFDocument } = PDFLib;
const fileInput = document.getElementById('files');
const dropzone = document.getElementById('dropzone');
const mergeBtn = document.getElementById('mergeBtn');
const fileList = document.getElementById('file-list');
const fileListPanel = document.getElementById('file-list-panel');
const fileCountLabel = document.getElementById('file-count-label');
const clearAllBtn = document.getElementById('clearAllBtn');
const progress = document.getElementById('progress');
const errors = document.getElementById('errors');
const downloadBox = document.getElementById('download-box');

let files = [];

// Drag and drop events
dropzone.addEventListener('click', () => fileInput.click());

dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
  dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) {
    addFiles(e.dataTransfer.files);
  }
});

fileInput.addEventListener('change', (e) => {
  if (e.target.files.length > 0) {
    addFiles(e.target.files);
  }
});

function addFiles(newFileList) {
  const arr = Array.from(newFileList).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
  if (arr.length > 0) {
    files = files.concat(arr);
    renderFileList();
    hideValidation();
    downloadBox.style.display = 'none';
  }
}

function formatBytes(bytes) {
  if (bytes === 0) return '0 Bytes';
  const k = 1024;
  const sizes = ['Bytes', 'KB', 'MB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function renderFileList() {
  fileList.innerHTML = '';
  if (files.length === 0) {
    fileListPanel.style.display = 'none';
    return;
  }

  fileListPanel.style.display = 'block';
  fileCountLabel.textContent = `Selected Files (${files.length})`;

  files.forEach((file, index) => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.dataset.index = index;

    const info = document.createElement('div');
    info.className = 'file-info';

    const name = document.createElement('div');
    name.className = 'file-name';
    name.textContent = file.name;

    const size = document.createElement('div');
    size.className = 'file-size';
    size.textContent = formatBytes(file.size);

    info.appendChild(name);
    info.appendChild(size);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.innerHTML = '🗑';
    removeBtn.title = 'Remove file';
    removeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      removeFile(index);
    });

    item.appendChild(info);
    item.appendChild(removeBtn);
    fileList.appendChild(item);
  });
}

function removeFile(index) {
  files.splice(index, 1);
  renderFileList();
  hideValidation();
  downloadBox.style.display = 'none';
}

clearAllBtn.addEventListener('click', () => {
  files = [];
  renderFileList();
  hideValidation();
  downloadBox.style.display = 'none';
  fileInput.value = '';
});

// Drag sorting initialization
new Sortable(fileList, {
  animation: 150,
  onEnd: (e) => {
    // Sync array state exactly to the new visual order
    const item = files.splice(e.oldIndex, 1)[0];
    files.splice(e.newIndex, 0, item);
    renderFileList();
  },
});

function showValidation(msg, isValid) {
  errors.textContent = msg;
  errors.className = 'validation-result ' + (isValid ? 'valid' : 'invalid');
  errors.style.display = 'block';
}

function hideValidation() {
  errors.style.display = 'none';
  errors.className = 'validation-result';
}

mergeBtn.addEventListener('click', async () => {
  hideValidation();
  downloadBox.style.display = 'none';

  if (files.length < 2) {
    showValidation('❌ Please upload at least two PDF documents to merge.', false);
    return;
  }

  try {
    progress.textContent = 'Merging PDFs...';
    const mergedPdf = await PDFDocument.create();

    for (const file of files) {
      const pdfBytes = await file.arrayBuffer();
      const pdf = await PDFDocument.load(pdfBytes);
      const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
      copiedPages.forEach(page => mergedPdf.addPage(page));
    }

    const mergedPdfBytes = await mergedPdf.save();
    const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);

    downloadBox.innerHTML = `
      <div class="download-card">
        <span>✓ Merged PDF generated successfully!</span>
        <a href="${url}" download="merged_document.pdf" class="download-btn">Download PDF</a>
      </div>
    `;
    downloadBox.style.display = 'block';
    progress.textContent = '';
    showValidation('✓ PDF files merged successfully!', true);
  } catch (err) {
    progress.textContent = '';
    showValidation('❌ Merging Error: ' + err.message, false);
  }
});
</script>
</body>
</html>
