<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SQL Formatter & Beautifier</title>
<style>
:root {
  --bg: #0f1724;
  --card: #0b1220;
  --accent: #06b6d4;
  --muted: #9aa8b2;
  --glass: rgba(255, 255, 255, 0.03);
}
* {
  box-sizing: border-box;
}
html, body {
  min-height: 100%;
  margin: 0;
  font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
  background: linear-gradient(180deg, #041025 0%, #0b1730 100%);
  color: #e6eef6;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.app {
  width: 900px;
  max-width: 96%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.03);
}
h1 {
  margin: 0;
  font-size: 22px;
}
p.lead {
  margin: 6px 0 18px;
  color: var(--muted);
  font-size: 13px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover {
  text-decoration: underline;
}
.control-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 15px;
}
.option-card {
  background: rgba(255, 255, 255, 0.01);
  border: 1px solid rgba(255, 255, 255, 0.03);
  border-radius: 8px;
  padding: 12px;
}
label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 500;
}
select, input[type="number"] {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.05);
  color: inherit;
  font-size: 14px;
  transition: border-color 0.2s;
}
select:focus, input[type="number"]:focus {
  outline: none;
  border-color: var(--accent);
}
.checkbox-group {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  font-size: 13px;
  margin-top: 5px;
}
.checkbox-group input {
  cursor: pointer;
}
.dropzone {
  border: 2px dashed rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  padding: 15px;
  text-align: center;
  background: var(--glass);
  cursor: pointer;
  transition: border-color 0.2s, background-color 0.2s;
  margin-bottom: 15px;
}
.dropzone:hover, .dropzone.dragover {
  border-color: var(--accent);
  background: rgba(6, 182, 212, 0.05);
}
.dropzone p {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}
.text-areas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 15px;
}
textarea {
  width: 100%;
  min-height: 300px;
  padding: 12px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.03);
  color: inherit;
  font-family: monospace;
  font-size: 13px;
  resize: vertical;
  box-sizing: border-box;
}
textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}
button {
  background: linear-gradient(90deg, var(--accent), #3b82f6);
  border: 0;
  padding: 10px 18px;
  font-weight: 600;
  border-radius: 8px;
  color: #042027;
  cursor: pointer;
  font-size: 13px;
  transition: opacity 0.2s, transform 0.1s;
}
button:hover {
  opacity: 0.9;
}
button:active {
  transform: scale(0.98);
}
button.secondary {
  background: var(--glass);
  color: #e6eef6;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
button.secondary:hover {
  background: rgba(255, 255, 255, 0.08);
}
.validation-result {
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
  margin-top: 10px;
}
.validation-result.valid {
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.2);
  color: #34d399;
  display: block;
}
.validation-result.invalid {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
  display: block;
}

@media (max-width: 768px) {
  .control-grid, .text-areas {
    grid-template-columns: 1fr !important;
  }
  .actions {
    flex-direction: column !important;
    gap: 10px !important;
  }
  button {
    width: 100%;
  }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/sql-formatter@15.4.0/dist/sql-formatter.min.js"></script>
</head>
<body>
<div class="app" role="main">
  <a href="../index.html" class="back-link">← Back to Home</a>
  <h1>SQL Formatter & Beautifier</h1>
  <p class="lead">Beautify, validate, and format your SQL queries locally. Supports multiple SQL dialects and customizable styling options.</p>

  <div class="control-grid">
    <div class="option-card">
      <label for="sql-dialect">SQL Dialect</label>
      <select id="sql-dialect">
        <option value="sql">Standard SQL</option>
        <option value="mysql">MySQL</option>
        <option value="postgresql">PostgreSQL</option>
        <option value="sqlite">SQLite</option>
        <option value="mariadb">MariaDB</option>
        <option value="transactsql">SQL Server (T-SQL)</option>
        <option value="plsql">Oracle PL/SQL</option>
        <option value="snowflake">Snowflake</option>
        <option value="redshift">Amazon Redshift</option>
        <option value="spark">Spark SQL</option>
        <option value="trino">Trino</option>
        <option value="singlestoredb">SingleStoreDB</option>
        <option value="db2">IBM DB2</option>
        <option value="n1ql">Couchbase N1QL</option>
      </select>
    </div>
    <div class="option-card">
      <label for="indent-size">Indentation</label>
      <select id="indent-size">
        <option value="2">2 Spaces</option>
        <option value="4">4 Spaces</option>
        <option value="tab">Tab</option>
      </select>
    </div>
    <div class="option-card">
      <label for="keyword-case">Keyword Case</label>
      <select id="keyword-case">
        <option value="upper">UPPERCASE</option>
        <option value="lower">lowercase</option>
        <option value="preserve">Preserve</option>
      </select>
    </div>
    <div class="option-card">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label class="checkbox-group">
          <input type="checkbox" id="dense-operators" />
          <span>Dense Operators</span>
        </label>
        <label class="checkbox-group">
          <input type="checkbox" id="newline-semicolon" />
          <span>Semicolon on New Line</span>
        </label>
      </div>
    </div>
  </div>

  <div class="dropzone" id="dropzone">
    <p>Drag & Drop a .sql file here, or click to browse</p>
    <input type="file" id="file-input" style="display: none;" accept=".sql,.txt" />
  </div>

  <div class="text-areas">
    <div>
      <label for="input">Input SQL Query</label>
      <textarea id="input" placeholder="Paste your raw, messy SQL query here..."></textarea>
    </div>
    <div>
      <label for="output">Formatted SQL Query</label>
      <textarea id="output" placeholder="Beautified SQL result will appear here..." readonly></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="format-btn">Format SQL</button>
    <button id="demo-btn" class="secondary">Load Demo SQL</button>
    <button id="clear-btn" class="secondary">Clear All</button>
    <button id="copy-btn" class="secondary">Copy Result</button>
    <button id="download-btn" class="secondary">Download SQL</button>
  </div>

  <div id="validation-box" class="validation-result"></div>
</div>

<script>
const sqlDialect = document.getElementById('sql-dialect');
const indentSize = document.getElementById('indent-size');
const keywordCase = document.getElementById('keyword-case');
const denseOperators = document.getElementById('dense-operators');
const newlineSemicolon = document.getElementById('newline-semicolon');

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');
const inputArea = document.getElementById('input');
const outputArea = document.getElementById('output');

const formatBtn = document.getElementById('format-btn');
const demoBtn = document.getElementById('demo-btn');
const clearBtn = document.getElementById('clear-btn');
const copyBtn = document.getElementById('copy-btn');
const downloadBtn = document.getElementById('download-btn');
const validationBox = document.getElementById('validation-box');

const DEMO_SQL = `SELECT users.id, users.username, COUNT(orders.id) AS total_orders, SUM(orders.amount) as total_spent FROM users LEFT JOIN orders ON users.id = orders.user_id WHERE users.status = 'active' AND orders.created_at >= '2023-01-01' GROUP BY users.id, users.username HAVING COUNT(orders.id) > 5 ORDER BY total_spent DESC LIMIT 10;`;

function showValidation(message, isValid) {
  validationBox.textContent = message;
  validationBox.className = 'validation-result ' + (isValid ? 'valid' : 'invalid');
  validationBox.style.display = 'block';
}

function hideValidation() {
  validationBox.style.display = 'none';
  validationBox.className = 'validation-result';
}

function getIndentParam() {
  const val = indentSize.value;
  if (val === 'tab') return '\t';
  return parseInt(val, 10);
}

function doFormatting() {
  const queryText = inputArea.value.trim();
  if (!queryText) {
    showValidation('Please enter some SQL query to format.', false);
    outputArea.value = '';
    return;
  }

  const dialect = sqlDialect.value;
  const indent = getIndentParam();
  const kwCase = keywordCase.value;
  const isDense = denseOperators.checked;
  const isSemicolonNL = newlineSemicolon.checked;

  try {
    const formatted = window.sqlFormatter.format(queryText, {
      language: dialect,
      tabWidth: typeof indent === 'number' ? indent : undefined,
      useTabs: indent === '\t',
      keywordCase: kwCase,
      dataTypeCase: kwCase,
      functionCase: kwCase,
      denseOperators: isDense,
      newlineBeforeSemicolon: isSemicolonNL,
      linesBetweenQueries: 2
    });

    outputArea.value = formatted;
    showValidation('✓ Success - SQL formatted successfully!', true);
  } catch (e) {
    showValidation('❌ SQL Formatting Error: ' + e.message, false);
    outputArea.value = '';
  }
}

// Drag & Drop
dropzone.addEventListener('click', () => fileInput.click());

dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
  dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  handleFile(file);
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  handleFile(file);
});

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    inputArea.value = e.target.result;
    hideValidation();
    doFormatting();
  };
  reader.readAsText(file);
}

// Clear All
clearBtn.addEventListener('click', () => {
  inputArea.value = '';
  outputArea.value = '';
  hideValidation();
});

// Demo SQL
demoBtn.addEventListener('click', () => {
  inputArea.value = DEMO_SQL;
  hideValidation();
  doFormatting();
});

// Copy Result
copyBtn.addEventListener('click', () => {
  if (outputArea.value) {
    navigator.clipboard.writeText(outputArea.value).then(() => {
      const originalText = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      setTimeout(() => {
        copyBtn.textContent = originalText;
      }, 1500);
    }).catch(err => {
      console.error('Copy failed: ', err);
    });
  }
});

// Download result
downloadBtn.addEventListener('click', () => {
  const content = outputArea.value;
  if (!content) return;

  const blob = new Blob([content], { type: 'text/sql' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = 'formatted_query.sql';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// Event Listeners for real-time adjustments if there's text
[sqlDialect, indentSize, keywordCase, denseOperators, newlineSemicolon].forEach(el => {
  el.addEventListener('change', () => {
    if (inputArea.value.trim()) {
      doFormatting();
    }
  });
});

formatBtn.addEventListener('click', doFormatting);

inputArea.addEventListener('input', () => {
  if (!inputArea.value.trim()) {
    hideValidation();
    outputArea.value = '';
  }
});
</script>
</body>
</html>
