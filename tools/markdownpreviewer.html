<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Markdown Previewer</title>
<style>
:root {
  --bg: #0f1724;
  --card: #0b1220;
  --accent: #06b6d4;
  --muted: #9aa8b2;
  --glass: rgba(255, 255, 255, 0.03);
}
html, body {
  min-height: 100%;
  margin: 0;
  font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
  background: linear-gradient(180deg, #041025 0%, #0b1730 100%);
  color: #e6eef6;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.app {
  width: 1000px;
  max-width: 96%;
  height: 80vh;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.03);
  display: flex;
  flex-direction: column;
}
h1 {
  margin: 0;
  font-size: 20px;
}
p.lead {
  margin: 6px 0 18px;
  color: var(--muted);
  font-size: 13px;
}
.stats {
  display: flex;
  gap: 20px;
  margin-bottom: 15px;
  font-size: 13px;
  color: var(--muted);
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}
button {
  background: linear-gradient(90deg, var(--accent), #3b82f6);
  border: 0;
  padding: 10px 18px;
  font-weight: 600;
  border-radius: 8px;
  color: #042027;
  cursor: pointer;
  font-size: 13px;
  transition: opacity 0.2s, transform 0.1s;
}
button:hover {
  opacity: 0.9;
}
button:active {
  transform: scale(0.98);
}
button.secondary {
  background: var(--glass);
  color: #e6eef6;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
button.secondary:hover {
  background: rgba(255, 255, 255, 0.08);
}
.editor-container {
  flex: 1;
  display: flex;
  gap: 20px;
  min-height: 0;
}
textarea, .preview {
  flex: 1;
  padding: 15px;
  border-radius: 8px;
  background: var(--glass);
  border: 1px solid rgba(255, 255, 255, 0.03);
  color: inherit;
  overflow-y: auto;
}
textarea {
  resize: none;
  font-family: 'Courier New', Courier, monospace;
}
.preview h1, .preview h2, .preview h3 {
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding-bottom: 5px;
}
.preview code {
  background: rgba(255, 255, 255, 0.1);
  padding: 2px 4px;
  border-radius: 4px;
}
.preview pre {
  background: rgba(255, 255, 255, 0.05);
  padding: 10px;
  border-radius: 8px;
  overflow-x: auto;
}

.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover {
  text-decoration: underline;
}

@media (max-width: 768px) {
  .app {
    height: auto !important;
    padding: 15px !important;
  }
  .editor-container {
    flex-direction: column !important;
    gap: 15px !important;
  }
  textarea, .preview {
    min-height: 250px !important;
    flex: none !important;
  }
  .stats, .actions {
    flex-direction: column !important;
    gap: 10px !important;
  }
  button {
    width: 100%;
  }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="app" role="main">
  <a href="../index.html" class="back-link">← Back to Home</a>
  <h1>Markdown Previewer</h1>
  <p class="lead">Type Markdown on the left and see the preview on the right.</p>

  <div class="stats">
    <div>Words: <span id="word-count">0</span></div>
    <div>Characters: <span id="char-count">0</span></div>
    <div>Lines: <span id="line-count">0</span></div>
  </div>

  <div class="actions">
    <button id="load-demo-btn">Load Demo</button>
    <button id="copy-md-btn" class="secondary">Copy Markdown</button>
    <button id="copy-html-btn" class="secondary">Copy HTML</button>
    <button id="download-html-btn" class="secondary">Download HTML</button>
    <button id="clear-btn" class="secondary">Clear All</button>
  </div>

  <div class="editor-container">
    <textarea id="markdown-input" placeholder="Enter Markdown here..."># Hello Markdown

This is a **live** preview.

## Features
- Real-time rendering
- Support for Github Flavored Markdown
- Dark theme

```javascript
console.log('Hello, World!');
```
</textarea>
    <div id="preview" class="preview"></div>
  </div>
</div>
<script>
const markdownInput = document.getElementById('markdown-input');
const preview = document.getElementById('preview');

const demoMarkdown = "# Markdown Cheat Sheet\n\n" +
"This is a **live** preview showing GitHub Flavored Markdown features.\n\n" +
"## Text Styling\n" +
"- **Bold text** or *italic text* or ~~strikethrough~~.\n" +
"- Code inline: `const answer = 42;`\n\n" +
"## Lists & Checklists\n" +
"1. First ordered item\n" +
"2. Second ordered item\n" +
"- [x] Completed task\n" +
"- [ ] Incomplete task\n\n" +
"## Table\n" +
"| Option | Description |\n" +
"| ------ | ----------- |\n" +
"| Tech | HTML5, CSS3, ES6 |\n" +
"| Output | Real-time Preview |\n\n" +
"## Blockquote\n" +
"> \"Code is like humor. When you have to explain it, it's bad.\" – Cory House\n\n" +
"## Code Block\n" +
"```javascript\n" +
"function greet(name) {\n" +
"  return `Hello, ${name}!`;\n" +
"}\n" +
"console.log(greet(\"Developer\"));\n" +
"```\n";

function updateCounters() {
  const text = markdownInput.value;
  const words = text.trim().split(/\s+/).filter(word => word.length > 0);
  const lines = text.length > 0 ? text.split('\n') : [];

  document.getElementById('word-count').textContent = words.length;
  document.getElementById('char-count').textContent = text.length;
  document.getElementById('line-count').textContent = lines.length;
}

function updatePreview() {
  preview.innerHTML = marked.parse(markdownInput.value);
  updateCounters();
}

markdownInput.addEventListener('input', updatePreview);

// Action listeners
document.getElementById('load-demo-btn').addEventListener('click', () => {
  markdownInput.value = demoMarkdown;
  updatePreview();
});

document.getElementById('clear-btn').addEventListener('click', () => {
  markdownInput.value = '';
  updatePreview();
});

document.getElementById('copy-md-btn').addEventListener('click', () => {
  if (markdownInput.value) {
    navigator.clipboard.writeText(markdownInput.value).then(() => {
      const btn = document.getElementById('copy-md-btn');
      const originalText = btn.textContent;
      btn.textContent = 'Copied Markdown!';
      setTimeout(() => btn.textContent = originalText, 1500);
    }).catch(err => console.error("Clipboard copy failed:", err));
  }
});

document.getElementById('copy-html-btn').addEventListener('click', () => {
  if (preview.innerHTML) {
    navigator.clipboard.writeText(preview.innerHTML).then(() => {
      const btn = document.getElementById('copy-html-btn');
      const originalText = btn.textContent;
      btn.textContent = 'Copied HTML!';
      setTimeout(() => btn.textContent = originalText, 1500);
    }).catch(err => console.error("Clipboard copy failed:", err));
  }
});

document.getElementById('download-html-btn').addEventListener('click', () => {
  const content = preview.innerHTML;
  if (!content) return;
  const fullHtml = `<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rendered Markdown</title>
<style>
body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
pre { background: #f4f4f4; padding: 10px; border-radius: 5px; overflow-x: auto; }
code { background: #eee; padding: 2px 4px; border-radius: 3px; }
table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
th { background-color: #f2f2f2; }
blockquote { border-left: 4px solid #ccc; margin: 0; padding-left: 10px; color: #666; }
</style>
</head>
<body>
${content}
</body>
</html>`;
  const blob = new Blob([fullHtml], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'rendered_markdown.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// Initial render
updatePreview();
</script>
</body>
</html>
